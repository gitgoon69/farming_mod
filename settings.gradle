pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}

	def mcTarget = settings.startParameter.projectProperties.getOrDefault('mc', '26.1.2').toString()
	def extra = new File(settings.settingsDir, "versions/${mcTarget}.properties")
	def loom = '1.16-SNAPSHOT'
	if (extra.exists()) {
		def props = new Properties()
		extra.withInputStream { props.load(it) }
		if (props.getProperty('loom_version')) {
			loom = props.getProperty('loom_version')
		}
	}
	resolutionStrategy {
		eachPlugin {
			if (requested.id.id == 'net.fabricmc.fabric-loom') {
				useVersion(loom)
			}
		}
	}
}

plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'fermento'
