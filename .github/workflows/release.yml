name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    if: ${{ !endsWith(github.ref_name, '-26.2') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ["26.1.2", "26.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon -Pmc=${{ matrix.mc }}
      - uses: actions/upload-artifact@v4
        with:
          name: farmingprofit-${{ matrix.mc }}
          path: |
            build/libs/farmingprofit-*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error

  release:
    if: ${{ !endsWith(github.ref_name, '-26.2') }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Version
        id: ver
        run: echo "ver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Release Minecraft 26.1.2 (Latest)
        uses: softprops/action-gh-release@v2
        with:
          name: Farming Profit ${{ steps.ver.outputs.ver }} — Minecraft 26.1.2
          make_latest: true
          prerelease: false
          files: dist/farmingprofit-26.1.2/*.jar
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Download

            **Minecraft 26.1.2 → this file** (`farmingprofit-${{ steps.ver.outputs.ver }}.jar`)

            One JAR in `.minecraft/mods/`, with Fabric Loader + Fabric API **26.1.2**.

            Playing **Minecraft 26.2**? Open the **“Minecraft 26.2”** release (not this one, not Latest):
            https://github.com/matteorlt/farming_mod/releases/tag/${{ github.ref_name }}-26.2
      - name: Release Minecraft 26.2 (not Latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}-26.2
          target_commitish: ${{ github.sha }}
          name: Farming Profit ${{ steps.ver.outputs.ver }} — Minecraft 26.2
          make_latest: false
          prerelease: false
          files: dist/farmingprofit-26.2/*.jar
          fail_on_unmatched_files: true
          body: |
            ## Minecraft 26.2 only

            File: `farmingprofit-${{ steps.ver.outputs.ver }}-minecraft-26.2.jar`

            **Do not install this JAR on 26.1.2.** The 26.1.2 build is here (Latest):
            https://github.com/matteorlt/farming_mod/releases/latest

            One JAR in `.minecraft/mods/`, with Fabric Loader + Fabric API **26.2**.
      - name: Keep 26.1.2 as Latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --latest
