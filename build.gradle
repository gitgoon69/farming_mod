plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

def mcTarget = (findProperty('mc') ?: '26.1.2').toString()
def versionFile = file("versions/${mcTarget}.properties")
if (versionFile.exists()) {
	def props = new Properties()
	versionFile.withInputStream { props.load(it) }
	props.each { key, value ->
		setProperty(key.toString(), value.toString())
	}
}

def mcDep = hasProperty('minecraft_dep') ? project.minecraft_dep : '~26.1'
def mcSuffix = project.minecraft_version.toString()
// 26.1.2 = farmingprofit-x.y.z.jar (Latest GitHub). 26.2 = farmingprofit-x.y.z-minecraft-26.2.jar
version = mcSuffix == '26.1.2' ? project.mod_version : "${project.mod_version}-minecraft-${mcSuffix}"
group = project.maven_group
base.archivesName = project.archives_base_name

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"farmingprofit" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def modVersion = project.mod_version
	inputs.property "version", modVersion
	inputs.property "minecraft", mcDep

	filesMatching("fabric.mod.json") {
		expand "version": modVersion, "minecraft": mcDep
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
}
